spring:
  application:
    name: stockpilot

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

yahoo-finance:
  api-key: ${YAHOO_FINANCE_API_KEY:}
  api-host: ${YAHOO_FINANCE_API_HOST:yahoo-finance15.p.rapidapi.com}
  base-url: https://yahoo-finance15.p.rapidapi.com

client:
  bok:
    api-key: ${BOK_API_KEY:}
    base-url: https://ecos.bok.or.kr/api
    enabled: ${BOK_ENABLED:true}
  dart:
    api-key: ${DART_API_KEY:}
    base-url: https://opendart.fss.or.kr
    enabled: ${DART_ENABLED:true}

disclosure:
  tracked-tickers:
    - "005930"  # 삼성전자
    - "000660"  # SK하이닉스
    - "035420"  # NAVER
    - "035720"  # 카카오
    - "005380"  # 현대차
    - "051910"  # LG화학
    - "005490"  # POSCO홀딩스
    - "068270"  # 셀트리온
    - "207940"  # 삼성바이오로직스
    - "373220"  # LG에너지솔루션

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,scheduledtasks
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: full

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 기반 주식 정보 + 투자 지식 허브 API
    java-version: ${java.version}
